<!doctype html>
<html lang="th" data-theme="buffet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="page.adminStaffTitle">
      จัดการพนักงาน
    </title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" type="image/png" href="/api/settings/favicon?v=1" />
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-800">
    <div class="min-h-screen lg:flex">
      <aside id="admin-sidebar">
      </aside>
      <main class="min-w-0 flex-1 px-4 pt-20 pb-6 sm:px-7 lg:px-9">
        <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
          <div>
            <p class="font-bold uppercase tracking-widest text-orange-600" data-i18n="admin.restaurantManagement">
              การจัดการร้าน
            </p>
            <h1 class="mt-1 text-3xl font-black" data-i18n="admin.staff.title">
              จัดการพนักงาน
            </h1>
          </div>
          <button id="add-staff-button" class="rounded-xl bg-orange-600 px-5 py-3 font-bold text-white" data-i18n="admin.staff.add">
            + เพิ่มพนักงาน
          </button>
        </header>
        <p id="page-message" class="mb-4 hidden rounded-xl p-4" role="status">
        </p>
        <div
                    id="staff-loading"
                    class="flex min-h-24 items-center justify-center gap-3 text-slate-500"
                    role="status"
                >
          <span
                        class="h-6 w-6 animate-spin rounded-full border-4 border-orange-100 border-t-orange-600"
                    >
          </span>
          <span data-i18n="admin.staff.loading">
            กำลังโหลดพนักงาน...
          </span>
        </div>
        <section class="overflow-hidden rounded-2xl bg-white shadow-sm">
          <div class="overflow-x-auto">
            <table class="w-full min-w-[700px] text-left">
              <thead class="bg-slate-50 text-sm text-slate-500">
                <tr>
                  <th class="p-4" data-i18n="admin.username">
                    ชื่อผู้ใช้
                  </th>
                  <th class="p-4" data-i18n="admin.fullName">
                    ชื่อ-นามสกุล
                  </th>
                  <th class="p-4" data-i18n="admin.role">
                    บทบาท
                  </th>
                  <th class="p-4" data-i18n="admin.status">
                    สถานะ
                  </th>
                  <th class="p-4 text-right" data-i18n="admin.actions">
                    จัดการ
                  </th>
                </tr>
              </thead>
              <tbody id="staff-rows" class="divide-y divide-slate-100">
              </tbody>
            </table>
          </div>
          <p id="staff-empty" class="hidden p-8 text-center text-slate-500" data-i18n="admin.staff.empty">
            ยังไม่มีบัญชีพนักงาน
          </p>
        </section>
      </main>
    </div>
    <div
            id="staff-modal"
            class="fixed inset-0 z-40 hidden items-center justify-center bg-slate-950/50 p-4"
            role="dialog"
            aria-modal="true"
        >
      <form id="staff-form" class="w-full max-w-md rounded-2xl bg-white p-6">
        <div class="mb-5 flex justify-between">
          <h2 id="staff-modal-title" class="text-2xl font-black" data-i18n-skip>
            เพิ่มพนักงาน
          </h2>
          <button data-close-modal type="button" class="rounded-lg bg-slate-100 px-3 py-2">
            ✕
          </button>
        </div>
        <input name="staffId" type="hidden">
        <label class="mb-4 block font-semibold">
          <span data-i18n="admin.username">
            ชื่อผู้ใช้
          </span>
          <input name="username" autocomplete="off" required class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-3">
        </label>
        <label class="mb-4 block font-semibold">
          <span data-i18n="admin.staff.password">
            รหัสผ่าน
          </span>
          <input name="password" type="password" minlength="8" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-3">
          <small id="password-hint" class="mt-1 block font-normal text-slate-500" data-i18n="admin.staff.passwordMin">
            ต้องมีอย่างน้อย 8 ตัวอักษร
          </small>
        </label>
        <label class="mb-4 block font-semibold">
          <span data-i18n="admin.fullName">
            ชื่อ-นามสกุล
          </span>
          <input name="fullName" class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-3">
        </label>
        <label class="mb-5 block font-semibold">
          <span data-i18n="admin.role">
            บทบาท
          </span>
          <select name="role" required class="mt-2 w-full rounded-xl border border-slate-300 px-3 py-3">
            <option value="manager" data-i18n="staff.role.managerShort">
              ผู้จัดการ
            </option>
            <option value="kitchen" data-i18n="staff.role.kitchenShort">
              ครัว
            </option>
            <option value="waiter" data-i18n="staff.role.waiterShort">
              พนักงานเสิร์ฟ
            </option>
            <option value="admin" data-i18n="staff.role.adminShort">
              แอดมิน
            </option>
          </select>
        </label>
        <button class="w-full rounded-xl bg-orange-600 px-4 py-3 font-bold text-white" data-i18n="admin.staff.save">
          บันทึกพนักงาน
        </button>
      </form>
    </div>
    <script src="/js/staff-auth.js">
    </script>
    <script src="/js/admin/common.js">
    </script>
    <script src="/js/admin/manageStaff.js">
    </script>
    <header class="fixed right-3 top-3 z-[100] flex items-center gap-2 rounded-xl bg-white/95 p-2 shadow-lg">
      <label for="langSwitcher" class="text-sm font-bold" data-i18n="language.label">
        ภาษา
      </label
            >
      <select id="langSwitcher" class="select select-bordered select-sm" aria-label="Language">
        <option value="th" data-i18n="language.th">
          ไทย
        </option>
        <option value="en" data-i18n="language.en">
          English
        </option>
      </select>
    </header>
    <script src="/js/i18n.js">
    </script>
    <script src="/js/brand.js">
    </script>
  </body>
</html>
