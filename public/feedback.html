<!DOCTYPE html>
<html lang="th" data-theme="buffet">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="page.feedbackTitle">
      รีวิวการใช้บริการ
    </title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" type="image/png" href="/api/settings/favicon?v=1">
  </head>
  <body class="min-h-screen bg-orange-50 text-slate-800">
    <main class="mx-auto flex min-h-screen max-w-xl flex-col justify-center px-4 py-10">
      <a href="/" class="mb-4 self-start text-sm font-semibold text-orange-700 hover:text-orange-900"
       data-i18n="status.backToHome">
        ← กลับหน้าแรก
      </a>
      <section class="rounded-3xl bg-white p-6 text-center shadow-xl shadow-orange-100 sm:p-9">
        <img src="/assets/images/empty-state.png" alt="" class="mx-auto mb-4 h-16 w-16 rounded-2xl object-contain">
        <p class="text-sm font-bold uppercase tracking-widest text-orange-600" data-i18n="feedback.thanksIntro">
          ขอบคุณที่มาใช้บริการ
        </p>
        <h1 class="mt-2 text-3xl font-black" data-i18n="feedback.question">
          คุณประทับใจแค่ไหน?
        </h1>
        <p class="mt-2 text-slate-500" data-i18n="feedback.description">
          ความคิดเห็นของคุณช่วยให้เราพัฒนาบริการได้ดียิ่งขึ้น
        </p>
        <form id="feedback-form" class="mt-7 text-left">
          <fieldset>
            <legend class="mb-3 text-center font-semibold" data-i18n="feedback.rating">
              ให้คะแนนประสบการณ์ของคุณ
            </legend>
            <div id="rating-stars" class="flex justify-center gap-2" role="radiogroup"
               aria-label="คะแนน 1 ถึง 5 ดาว"
               data-i18n="feedback.ratingAria" data-i18n-attr="aria-label">
              <button type="button" class="rating-star text-slate-300 transition hover:scale-110" data-rating="1" role="radio" aria-checked="false"
                    aria-label="1 ดาว" data-i18n="feedback.ratingStarAria" data-i18n-attr="aria-label" data-i18n-vars='{"n":1}'>
                <svg viewBox="0 0 24 24" class="h-10 w-10" fill="currentColor" aria-hidden="true">
                  <path d="m12 2.7 2.85 5.78 6.38.93-4.62 4.5 1.09 6.36L12 17.27l-5.7 3 1.09-6.36-4.62-4.5 6.38-.93L12 2.7Z"/>
                </svg>
              </button>
              <button type="button" class="rating-star text-slate-300 transition hover:scale-110" data-rating="2" role="radio" aria-checked="false"
                    aria-label="2 ดาว" data-i18n="feedback.ratingStarAria" data-i18n-attr="aria-label" data-i18n-vars='{"n":2}'>
                <svg viewBox="0 0 24 24" class="h-10 w-10" fill="currentColor" aria-hidden="true">
                  <path d="m12 2.7 2.85 5.78 6.38.93-4.62 4.5 1.09 6.36L12 17.27l-5.7 3 1.09-6.36-4.62-4.5 6.38-.93L12 2.7Z"/>
                </svg>
              </button>
              <button type="button" class="rating-star text-slate-300 transition hover:scale-110" data-rating="3" role="radio" aria-checked="false"
                    aria-label="3 ดาว" data-i18n="feedback.ratingStarAria" data-i18n-attr="aria-label" data-i18n-vars='{"n":3}'>
                <svg viewBox="0 0 24 24" class="h-10 w-10" fill="currentColor" aria-hidden="true">
                  <path d="m12 2.7 2.85 5.78 6.38.93-4.62 4.5 1.09 6.36L12 17.27l-5.7 3 1.09-6.36-4.62-4.5 6.38-.93L12 2.7Z"/>
                </svg>
              </button>
              <button type="button" class="rating-star text-slate-300 transition hover:scale-110" data-rating="4" role="radio" aria-checked="false"
                    aria-label="4 ดาว" data-i18n="feedback.ratingStarAria" data-i18n-attr="aria-label" data-i18n-vars='{"n":4}'>
                <svg viewBox="0 0 24 24" class="h-10 w-10" fill="currentColor" aria-hidden="true">
                  <path d="m12 2.7 2.85 5.78 6.38.93-4.62 4.5 1.09 6.36L12 17.27l-5.7 3 1.09-6.36-4.62-4.5 6.38-.93L12 2.7Z"/>
                </svg>
              </button>
              <button type="button" class="rating-star text-slate-300 transition hover:scale-110" data-rating="5" role="radio" aria-checked="false"
                    aria-label="5 ดาว" data-i18n="feedback.ratingStarAria" data-i18n-attr="aria-label" data-i18n-vars='{"n":5}'>
                <svg viewBox="0 0 24 24" class="h-10 w-10" fill="currentColor" aria-hidden="true">
                  <path d="m12 2.7 2.85 5.78 6.38.93-4.62 4.5 1.09 6.36L12 17.27l-5.7 3 1.09-6.36-4.62-4.5 6.38-.93L12 2.7Z"/>
                </svg>
              </button>
            </div>
          </fieldset>
          <label class="mt-6 block">
            <span class="mb-2 block font-semibold">
              <span data-i18n="feedback.comment">
                ความคิดเห็น
              </span>
              <span class="font-normal text-slate-400" data-i18n="queue.optional">
                (ไม่บังคับ)
              </span>
            </span>
            <textarea id="feedback-comment" rows="4" maxlength="1000"placeholder="เล่าให้เราฟังได้เลย..."data-i18n="feedback.placeholder" data-i18n-attr="placeholder"class="w-full resize-y rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-100"></textarea>
          </label>
          <button id="feedback-submit" type="submit" class="mt-5 flex w-full items-center justify-center gap-3 rounded-xl bg-orange-600 px-5 py-3 font-bold text-white hover:bg-orange-700 disabled:cursor-not-allowed disabled:opacity-60">
            <span id="feedback-spinner" class="hidden h-5 w-5 animate-spin rounded-full border-2 border-white/40 border-t-white">
            </span>
            <span data-i18n="feedback.submit">
              ส่งรีวิว
            </span>
          </button>
        </form>
        <p id="feedback-error" class="mt-4 hidden rounded-lg bg-red-50 p-3 text-left text-sm text-red-700" role="alert">
        </p>
        <div id="feedback-success" class="mt-6 hidden rounded-2xl bg-green-50 p-5" role="status">
          <p class="text-xl font-bold text-green-800" data-i18n="feedback.thanks">
            ขอบคุณสำหรับรีวิว
          </p>
          <p id="feedback-countdown" class="mt-2 text-sm text-slate-500">
          </p>
          <a id="feedback-home" href="/" class="mt-3 inline-flex items-center justify-center rounded-lg bg-slate-900 px-4 py-2 text-sm font-bold text-white hover:bg-slate-800"
           data-i18n="feedback.backHome">
            กลับหน้าแรก
          </a>
        </div>
      </section>
    </main>
    <script src="/js/customer/feedback.js">
    </script>
    <header class="fixed right-3 top-3 z-[100] flex items-center gap-1.5 rounded-xl bg-white/95 p-1.5 shadow-lg">
      <label for="langSwitcher" class="pl-2 text-xs font-bold text-slate-500" data-i18n="language.label">
        ภาษา
      </label>
      <select id="langSwitcher" class="rounded-lg border border-slate-200 bg-white px-2 py-1 text-xs font-bold text-slate-700 focus:outline-none focus:ring-2 focus:ring-orange-500" aria-label="Language">
        <option value="th" data-i18n="language.th">
          ไทย
        </option>
        <option value="en" data-i18n="language.en">
          English
        </option>
      </select>
    </header>
    <script src="/js/i18n.js">
    </script>
    <script src="/js/brand.js">
    </script>
  </body>
</html>
