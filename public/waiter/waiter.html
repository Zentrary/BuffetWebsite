<!DOCTYPE html>
<html lang="th" data-theme="buffet">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title data-i18n="page.waiterTitle">
      หน้าจอพนักงานเสิร์ฟ
    </title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" type="image/png" href="/api/settings/favicon?v=1">
  </head>
  <body class="min-h-screen bg-orange-50 pb-6 text-slate-800">
    <header class="sticky top-0 z-20 border-b border-slate-700 bg-slate-900 text-white shadow-xl">
      <div class="mx-auto flex w-full flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-6">
        <div class="min-w-0">
          <p class="text-[10px] font-bold uppercase tracking-widest text-orange-400">
            TEEHID Buffet
          </p>
          <h1 class="mt-0.5 truncate text-xl font-black sm:text-2xl" data-i18n="waiter.title">
            หน้าจอพนักงานเสิร์ฟ
          </h1>
        </div>
        <div class="flex flex-wrap items-center gap-1.5">
          <span id="connection-status" class="inline-flex h-9 items-center gap-1.5 rounded-lg bg-slate-800 px-3 text-xs font-bold text-slate-300">
            <span id="connection-dot" class="h-2 w-2 rounded-full bg-slate-500">
            </span>
            <span id="connection-label" data-i18n="connection.loading">
              กำลังโหลดข้อมูล
            </span>
          </span>
          <button id="logout-button" type="button" class="inline-flex h-9 items-center gap-1.5 rounded-lg bg-red-600 px-3 text-xs font-bold text-white transition hover:bg-red-500">
            <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
            ออกจากระบบ
          </button>
          <div class="inline-flex h-9 items-center gap-1 rounded-lg bg-slate-800 px-1 text-xs font-bold text-slate-300">
            <svg viewBox="0 0 24 24" class="ml-1 h-3.5 w-3.5 opacity-70" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/>
            </svg>
            <select id="langSwitcher" class="rounded-md border-0 bg-slate-700 px-1.5 py-0.5 text-xs font-bold text-white focus:outline-none focus:ring-2 focus:ring-orange-500" aria-label="Language">
              <option value="th" data-i18n="language.th">
                ไทย
              </option>
              <option value="en" data-i18n="language.en">
                English
              </option>
            </select>
          </div>
        </div>
      </div>
    </header>
    <main class="mx-auto w-full px-3 py-4 sm:px-5 lg:px-6">
      <nav class="mb-4 flex gap-1 rounded-xl bg-white p-1 shadow-sm" aria-label="Waiter menu">
        <button class="waiter-tab flex-1 rounded-lg bg-orange-600 px-3 py-2 text-sm font-bold text-white" data-tab="ready" type="button" aria-selected="true">
          <span data-i18n="waiter.ready">
            รอเสิร์ฟ
          </span>
          <span id="ready-count" class="ml-1 rounded-full bg-white/20 px-2 py-0.5 text-xs">
            0
          </span>
        </button>
        <button class="waiter-tab flex-1 rounded-lg px-3 py-2 text-sm font-bold text-slate-600 hover:bg-orange-50" data-tab="tables" type="button" aria-selected="false" data-i18n="waiter.tables">
          จัดการโต๊ะ
        </button>
      </nav>
      <p id="waiter-error" class="mb-3 hidden rounded-lg bg-red-100 p-3 text-sm text-red-800" role="alert">
      </p>
      <p id="waiter-success" class="mb-3 hidden rounded-lg bg-green-100 p-3 text-sm font-semibold text-green-800" role="status">
      </p>
      <div id="waiter-loading" class="hidden items-center justify-center gap-3 py-12 text-slate-500" role="status">
        <span class="h-6 w-6 animate-spin rounded-full border-4 border-orange-100 border-t-orange-600">
        </span>
        กำลังโหลดข้อมูล...
      </div>
      <section id="tab-ready" class="waiter-panel">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="text-xl font-extrabold" data-i18n="waiter.readyOrders">
              ออเดอร์รอเสิร์ฟ
            </h2>
            <p class="text-xs text-slate-500" data-i18n="waiter.readyDesc">
              แตะการ์ดเพื่อดูรายละเอียดและกดเสิร์ฟ
            </p>
          </div>
          <button id="refresh-waiter" type="button" class="inline-flex h-9 items-center gap-1.5 rounded-lg bg-slate-800 px-3 text-xs font-bold text-white transition hover:bg-slate-700">
            <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>
            </svg>
            <span data-i18n="kitchen.refresh">
              รีเฟรช
            </span>
          </button>
        </div>
        <div id="ready-orders" class="grid grid-cols-2 gap-2.5 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
        </div>
        <p id="ready-empty" class="hidden rounded-xl bg-white p-8 text-center text-lg font-bold text-slate-400" data-i18n="waiter.noReady">
          ไม่มีออเดอร์รอเสิร์ฟ
        </p>
      </section>
      <section id="tab-tables" class="waiter-panel hidden">
        <div class="mb-3 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="text-xl font-extrabold" data-i18n="waiter.tableMap">
              ผังโต๊ะ
            </h2>
            <p class="text-xs text-slate-500" data-i18n="waiter.tableMapDesc">
              ภาพรวมสถานะโต๊ะทั้งหมด
            </p>
          </div>
          <button id="refresh-tables" type="button" class="inline-flex h-9 items-center gap-1.5 rounded-lg bg-slate-800 px-3 text-xs font-bold text-white transition hover:bg-slate-700">
            <svg viewBox="0 0 24 24" class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>
            </svg>
            <span data-i18n="kitchen.refresh">
              รีเฟรช
            </span>
          </button>
        </div>
        <div id="table-map" class="space-y-5">
        </div>
        <p id="tables-empty" class="hidden rounded-xl bg-white p-8 text-center text-lg font-bold text-slate-400" data-i18n="waiter.noTables">
          ยังไม่มีข้อมูลโต๊ะ
        </p>
      </section>
    </main>
    <div id="order-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 p-4" role="dialog" aria-modal="true">
      <section class="relative w-full max-w-md rounded-2xl bg-white p-5 shadow-2xl">
        <button id="order-modal-close" type="button" class="btn btn-square btn-ghost absolute right-3 top-3" aria-label="ปิด">
          ×
        </button>
        <div id="order-modal-body">
        </div>
      </section>
    </div>
    <div id="audio-toast" class="pointer-events-none fixed bottom-4 right-4 z-[200] rounded-lg bg-amber-500 px-4 py-2 text-sm font-bold text-slate-900 shadow-lg" data-i18n="kitchen.audioNotice">
      คลิกที่หน้าเว็บ 1 ครั้งเพื่อเปิดเสียงแจ้งเตือน
    </div>
    <script src="/socket.io/socket.io.js">
    </script>
    <script src="/js/i18n.js">
    </script>
    <script src="/js/staff-auth.js">
    </script>
    <script src="/js/live-updates.js">
    </script>
    <script src="/js/waiter/waiter.js">
    </script>
    <script src="/js/brand.js">
    </script>
  </body>
</html>
