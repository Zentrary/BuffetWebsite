<!DOCTYPE html>
<html lang="th" data-theme="buffet">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05080f">
    <title data-i18n="display.title">
      จอแสดงคิว
    </title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="icon" type="image/png" href="/api/settings/favicon?v=1">
    <style>
      /* ===================================================================
         TV queue board — dark "premium lounge" theme.
         Everything is scoped to this page so no CSS build step is needed.
         =================================================================== */
      :root {
        --ink: #05080f;
        --ink-soft: #0b1220;
        --line: rgba(148, 163, 184, 0.14);
        --muted: #94a3b8;
        --amber: #fb923c;
        --amber-soft: #fdba74;
        --radius-card: 1.75rem;
      }

      html, body { height: 100%; overflow: hidden; }

      body {
        background:
          radial-gradient(1100px 620px at 50% -18%, rgba(37, 99, 235, 0.16), transparent 62%),
          radial-gradient(880px 520px at 12% 108%, rgba(249, 115, 22, 0.16), transparent 68%),
          radial-gradient(760px 420px at 92% 96%, rgba(14, 165, 233, 0.12), transparent 66%),
          var(--ink) !important;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
      }

      /* Faint grid + vignette so the empty space still looks designed. */
      body::before,
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        background-image:
          linear-gradient(to right, rgba(148, 163, 184, 0.055) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.055) 1px, transparent 1px);
        background-size: 76px 76px;
        mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 78%);
        -webkit-mask-image: radial-gradient(circle at 50% 42%, #000 0%, transparent 78%);
      }
      body::after {
        background: radial-gradient(circle at 50% 48%, transparent 44%, rgba(2, 6, 16, 0.72) 100%);
      }
      body > * { position: relative; z-index: 1; }

      /* ---------- header ---------- */
      .board-header {
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(8, 13, 24, 0.92), rgba(8, 13, 24, 0.62));
        backdrop-filter: blur(14px);
      }

      .brand-mark {
        box-shadow:
          0 0 0 1px rgba(249, 115, 22, 0.35),
          0 0 26px -8px rgba(249, 115, 22, 0.75);
      }

      .header-kicker {
        background: linear-gradient(90deg, var(--amber-soft), #f97316 60%, #fbbf24);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .pill-status {
        border: 1px solid var(--line);
        background: rgba(15, 23, 42, 0.66);
        color: var(--muted);
        transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease;
      }

      .icon-button {
        border: 1px solid rgba(148, 163, 184, 0.22);
        background: rgba(15, 23, 42, 0.7);
        color: var(--amber-soft);
        transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, color 0.18s ease;
      }
      .icon-button:hover {
        border-color: rgba(249, 115, 22, 0.65);
        background: rgba(30, 41, 59, 0.9);
        color: #fdba74;
        transform: translateY(-1px);
      }
      .icon-button:active { transform: translateY(0) scale(0.97); }

      .clock-face {
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.02em;
        background: linear-gradient(180deg, #f8fafc, #cbd5e1);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* ---------- section heading ---------- */
      .section-rule {
        background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.65), transparent);
        height: 1px;
      }

      .section-title {
        letter-spacing: 0.42em;
        color: #fdba74;
        text-shadow: 0 0 26px rgba(249, 115, 22, 0.45);
      }

      .section-dot {
        box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.12), 0 0 18px 2px rgba(249, 115, 22, 0.6);
        animation: pulse-soft 2.4s ease-in-out infinite;
      }

      /* ---------- now serving ---------- */
      .now-serving-grid {
        align-content: center;
        justify-content: center;
        grid-template-columns: minmax(0, 1fr);
      }

      /* Adaptive grid: 1–4 columns depending on how many queues are called. */
      #now-serving[data-count="1"] { max-width: 46rem; }
      #now-serving[data-count="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #now-serving[data-count="3"] { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #now-serving[data-count="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }

      .serving-card {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: 11rem;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        overflow: hidden;
        border-radius: var(--radius-card);
        border: 1px solid rgba(148, 163, 184, 0.16);
        background:
          radial-gradient(120% 96% at 50% -12%, rgba(249, 115, 22, 0.22), transparent 62%),
          linear-gradient(180deg, rgba(17, 25, 41, 0.96), rgba(8, 13, 24, 0.97));
        padding: 1.5rem 1.25rem 1.35rem;
        text-align: center;
        box-shadow:
          0 34px 90px -60px rgba(249, 115, 22, 0.95),
          inset 0 1px 0 rgba(255, 255, 255, 0.05);
        animation: card-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* soft glowing aura behind each card */
      .serving-card::before {
        content: '';
        position: absolute;
        inset: -40% -20% auto -20%;
        height: 70%;
        z-index: -1;
        background: radial-gradient(closest-side, var(--zone-glow, rgba(249, 115, 22, 0.34)), transparent 72%);
        filter: blur(6px);
        opacity: 0.9;
      }

      /* hairline gradient border on top of the card */
      .serving-card::after {
        content: '';
        position: absolute;
        inset-inline: 18%;
        top: 0;
        height: 2px;
        border-radius: 9999px;
        background: linear-gradient(90deg, transparent, var(--zone-accent, #fb923c), transparent);
      }

      .serving-card[data-zone="small"]  { --zone-accent: #38bdf8; --zone-glow: rgba(56, 189, 248, 0.3); }
      .serving-card[data-zone="medium"] { --zone-accent: #fb923c; --zone-glow: rgba(251, 146, 60, 0.34); }
      .serving-card[data-zone="large"]  { --zone-accent: #c084fc; --zone-glow: rgba(192, 132, 252, 0.3); }

      .serving-head {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        color: #94a3b8;
      }

      .serving-kicker {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 9999px;
        background: rgba(2, 6, 16, 0.55);
        padding: 0.25rem 0.7rem;
        color: var(--zone-accent, #fdba74);
        font-size: clamp(0.62rem, 0.85vw, 0.78rem);
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .serving-kicker svg { height: 0.85em; width: 0.85em; }

      .serving-time {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(0.62rem, 0.85vw, 0.8rem);
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #64748b;
        white-space: nowrap;
      }

      .serving-number {
        margin: 0.15rem 0 0;
        background: linear-gradient(180deg, #ffffff 22%, #e2e8f0 58%, var(--zone-accent, #fdba74) 130%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(2.6rem, 5vw, 4.1rem);
        font-variant-numeric: tabular-nums;
        font-weight: 900;
        letter-spacing: 0.015em;
        line-height: 0.94;
      }

      #now-serving[data-count="1"] .serving-number { font-size: clamp(5.5rem, 15vw, 12rem); }
      #now-serving[data-count="2"] .serving-number { font-size: clamp(3.6rem, 9vw, 7rem); }

      .serving-table {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 0.55rem;
        border-radius: 9999px;
        background: linear-gradient(135deg, var(--zone-accent, #f97316), color-mix(in srgb, var(--zone-accent, #f97316) 62%, #ffffff 12%));
        color: #060b14;
        font-weight: 900;
        font-size: clamp(1rem, 1.6vw, 1.35rem);
        padding: 0.42rem 1.15rem;
        box-shadow: 0 16px 34px -22px var(--zone-accent, #f97316);
      }
      .serving-table svg { height: 1.05em; width: 1.05em; opacity: 0.75; }
      .serving-table span {
        font-size: 0.6em;
        font-weight: 800;
        letter-spacing: 0.18em;
        opacity: 0.7;
        text-transform: uppercase;
      }
      .serving-table b { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

      .serving-table-pending {
        background: rgba(51, 65, 85, 0.85);
        color: #e2e8f0;
        font-size: clamp(0.82rem, 1.15vw, 1rem);
        box-shadow: none;
      }

      .serving-meta {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 0.3rem;
        color: #94a3b8;
        font-size: clamp(0.75rem, 1.05vw, 0.95rem);
        font-weight: 600;
      }
      .serving-meta svg { height: 1em; width: 1em; opacity: 0.6; }

      #now-serving[data-count="3"] .serving-card,
      #now-serving[data-count="4"] .serving-card {
        min-height: 9rem;
        padding: 1rem 0.85rem 0.95rem;
      }
      #now-serving[data-count="3"] .serving-number,
      #now-serving[data-count="4"] .serving-number { font-size: clamp(2.2rem, 4vw, 3.2rem); }

      /* ---------- empty / error states ---------- */
      .serving-empty {
        display: flex;
        grid-column: 1 / -1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        padding: 1.5rem 1rem;
        text-align: center;
      }

      .serving-empty-icon {
        display: flex;
        height: 5.5rem;
        width: 5.5rem;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.75rem;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 1.5rem;
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.72), rgba(15, 23, 42, 0.86));
        color: #64748b;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }
      .serving-empty-icon::after {
        content: '';
        position: absolute;
        inset: 0;
        height: 5.5rem;
        width: 5.5rem;
        border-radius: 1.5rem;
        border: 1px solid rgba(249, 115, 22, 0.18);
        animation: halo 3.4s ease-out infinite;
      }
      .serving-empty-icon { position: relative; }

      .serving-empty-title {
        color: #e2e8f0;
        font-size: clamp(1.35rem, 2.6vw, 2rem);
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .serving-empty-hint {
        color: #64748b;
        font-size: clamp(0.82rem, 1.25vw, 1.05rem);
      }

      .serving-more {
        grid-column: 1 / -1;
        color: #94a3b8;
        font-size: 0.9rem;
        font-weight: 700;
        text-align: center;
      }

      /* ---------- waiting strip ---------- */
      .waiting-bar {
        border-top: 1px solid var(--line);
        background: linear-gradient(180deg, rgba(8, 13, 24, 0.72), rgba(5, 8, 15, 0.96));
        backdrop-filter: blur(10px);
      }

      .waiting-count-ring {
        display: flex;
        height: 3.4rem;
        width: 3.4rem;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        border: 1px solid rgba(249, 115, 22, 0.3);
        background:
          radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.28), transparent 70%),
          rgba(15, 23, 42, 0.8);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      }

      .waiting-chip {
        display: inline-flex;
        align-items: baseline;
        gap: 0.4rem;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 0.7rem;
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.85));
        color: #f1f5f9;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(0.85rem, 1.15vw, 1.05rem);
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        padding: 0.35rem 0.7rem;
        animation: chip-in 0.32s ease-out both;
      }

      .waiting-chip small {
        color: #94a3b8;
        font-family: inherit;
        font-size: 0.72em;
        font-weight: 600;
      }

      .waiting-more {
        color: #94a3b8;
        font-size: 0.82rem;
        font-weight: 700;
        padding: 0.35rem 0.4rem;
      }

      .waiting-empty {
        color: #64748b;
        font-size: 0.9rem;
      }

      .waiting-hint {
        color: #475569;
        font-size: clamp(0.7rem, 0.95vw, 0.8rem);
        font-weight: 600;
      }

      /* ---------- motion ---------- */
      @keyframes pulse-soft {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      @keyframes halo {
        0%   { opacity: 0.6; transform: scale(1); }
        70%  { opacity: 0;   transform: scale(1.28); }
        100% { opacity: 0;   transform: scale(1.28); }
      }

      @keyframes card-in {
        from { opacity: 0; transform: translateY(14px) scale(0.97); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes chip-in {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Newly called queue: ring of light + gentle breathing glow. */
      @keyframes card-flash {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(251, 146, 60, 0.55), 0 34px 90px -60px rgba(249, 115, 22, 0.95);
        }
        45% {
          transform: scale(1.02);
          box-shadow: 0 0 0 18px rgba(251, 146, 60, 0.06), 0 0 60px 6px rgba(251, 146, 60, 0.35);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(251, 146, 60, 0), 0 34px 90px -60px rgba(249, 115, 22, 0.95);
        }
      }
      .card-flash {
        animation: card-flash 1.5s ease-out 3;
        border-color: rgba(251, 146, 60, 0.55) !important;
      }

      @keyframes live-pulse {
        0%, 100% { opacity: 1;   transform: scale(1); }
        50%      { opacity: 0.35; transform: scale(0.8); }
      }
      .live-dot { animation: live-pulse 1.8s ease-in-out infinite; }

      .top-accent {
        background: linear-gradient(90deg, transparent 0%, #ea580c 26%, #fb923c 50%, #ea580c 74%, transparent 100%);
        height: 2px;
        box-shadow: 0 0 22px rgba(249, 115, 22, 0.55);
      }

      /* ---------- responsive ---------- */
      @media (max-width: 1100px) {
        #now-serving[data-count="3"],
        #now-serving[data-count="4"] { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        #now-serving[data-count="1"] { max-width: 100%; }
        #now-serving[data-count="1"] .serving-number { font-size: clamp(4.5rem, 18vw, 9rem); }
      }

      @media (max-width: 640px) {
        #now-serving,
        #now-serving[data-count="2"],
        #now-serving[data-count="3"],
        #now-serving[data-count="4"] {
          grid-template-columns: minmax(0, 1fr);
          max-width: 100%;
        }
        #now-serving[data-count="1"] .serving-number,
        #now-serving[data-count="2"] .serving-number,
        .serving-number { font-size: clamp(3.2rem, 17vw, 5rem); }
      }

      @media (prefers-reduced-motion: reduce) {
        .serving-card, .waiting-chip, .card-flash, .live-dot, .serving-empty-icon::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body class="flex h-screen w-screen flex-col overflow-hidden">
    <div class="top-accent shrink-0"></div>

    <!-- ===== HEADER ===== -->
    <header class="board-header flex shrink-0 items-center justify-between gap-3 px-5 py-3 sm:px-8 sm:py-3.5">
      <div class="flex min-w-0 items-center gap-3.5">
        <img data-shop-logo src="/assets/images/logo.png" alt=""
          class="brand-mark h-11 w-11 shrink-0 rounded-2xl bg-slate-950 object-contain p-1 sm:h-12 sm:w-12">
        <div class="min-w-0">
          <p class="header-kicker text-[10px] font-bold uppercase tracking-[0.3em] sm:text-[11px]" data-i18n="display.kicker">
            Queue Display
          </p>
          <h1 data-shop-name class="truncate text-lg font-black leading-tight tracking-tight text-white sm:text-xl">
            Restaurant
          </h1>
        </div>
      </div>

      <div class="flex shrink-0 items-center gap-2 sm:gap-3">
        <!-- Live indicator -->
        <span id="live-indicator"
          class="pill-status inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-[11px] font-bold sm:text-xs">
          <span id="live-dot" class="live-dot inline-block h-2 w-2 rounded-full bg-slate-500"></span>
          <span id="live-label" data-i18n="connection.loading">
            กำลังโหลดข้อมูล
          </span>
        </span>

        <!-- Clock -->
        <span id="clock"
          class="clock-face hidden font-mono text-lg font-black tabular-nums sm:inline sm:text-2xl">
          --:--
        </span>

        <!-- Sound toggle -->
        <button id="sound-btn" type="button"
          class="icon-button flex h-12 w-12 items-center justify-center rounded-xl sm:h-14 sm:w-14"
          aria-label="Toggle sound" title="Toggle sound">
          <svg id="sound-on-icon" viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4z" />
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
          </svg>
          <svg id="sound-off-icon" viewBox="0 0 24 24" class="hidden h-6 w-6" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M11 5 6 9H2v6h4l5 4z" />
            <line x1="23" y1="9" x2="17" y2="15" />
            <line x1="17" y1="9" x2="23" y2="15" />
          </svg>
        </button>

        <!-- Fullscreen toggle -->
        <button id="fullscreen-btn" type="button"
          class="icon-button flex h-12 w-12 items-center justify-center rounded-xl sm:h-14 sm:w-14"
          aria-label="Fullscreen" title="Fullscreen">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3" />
          </svg>
        </button>
      </div>
    </header>

    <!-- ===== NOW SERVING ===== -->
    <section class="flex min-h-0 flex-1 flex-col items-center justify-center overflow-hidden px-4 py-5 sm:px-8 sm:py-7">
      <div class="mb-5 flex shrink-0 items-center gap-3 sm:mb-7 sm:gap-4">
        <span class="section-rule w-10 sm:w-20"></span>
        <span class="section-dot h-1.5 w-1.5 rounded-full bg-orange-400"></span>
        <h2 class="section-title text-center text-[11px] font-black uppercase sm:text-sm" data-i18n="display.nowServing">
          กำลังเรียก
        </h2>
        <span class="section-dot h-1.5 w-1.5 rounded-full bg-orange-400"></span>
        <span class="section-rule w-10 sm:w-20"></span>
      </div>

      <div id="now-serving" class="now-serving-grid grid w-full max-w-7xl flex-1 gap-3 sm:gap-5"
        aria-live="polite" aria-busy="true"></div>
    </section>

    <!-- ===== WAITING ===== -->
    <section class="waiting-bar shrink-0 px-4 py-3.5 sm:px-8 sm:py-4">
      <div class="flex items-center gap-4">
        <div class="flex shrink-0 items-center gap-3 border-r border-slate-800/70 pr-4 sm:pr-5">
          <div class="waiting-count-ring">
            <p id="waiting-count" class="font-mono text-2xl font-black leading-none text-white tabular-nums">
              0
            </p>
          </div>
          <div>
            <p class="text-[10px] font-bold uppercase tracking-[0.24em] text-slate-500 sm:text-[11px]"
              data-i18n="display.waitingTitle">
              รอเรียก
            </p>
            <p class="waiting-hint mt-0.5 hidden sm:block" data-i18n="display.waitingHint">
              คิวที่รอเรียกอยู่ในขณะนี้
            </p>
          </div>
        </div>
        <div id="waiting-list" class="flex max-h-24 min-w-0 flex-1 flex-wrap items-center gap-2 overflow-hidden sm:max-h-none">
        </div>
      </div>
    </section>

    <!-- ===== AUDIO PROMPT ===== -->
    <div id="audio-prompt"
      class="pointer-events-none fixed bottom-28 right-5 z-50 hidden rounded-xl border border-amber-300/40 bg-amber-500 px-4 py-2.5 text-sm font-bold text-slate-900 shadow-2xl"
      data-i18n="display.audioPrompt">
      คลิกที่หน้าจอ 1 ครั้งเพื่อเปิดเสียงแจ้งเตือน
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/customer/shop-info.js"></script>
    <script src="/js/brand.js"></script>
    <script src="/js/live-updates.js"></script>
    <script src="/js/display.js"></script>
  </body>
</html>
